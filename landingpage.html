                        "primary": "#00eeff",

    text-shadow: 0 0 10px rgba(0, 238, 255, 0.7)

    box-shadow: 0 0 20px rgba(255, 0, 153, 0.2)

<body class="bg-background-light dark:bg-background-dark text-white font-display overflow-hidden selection:bg-primary selection:text-background-dark">
<div class="relative min-h-screen w-full flex flex-col items-center justify-center">
<!-- Background Elements -->
<div class="absolute inset-0 bg-nebula -z-20"></div>
<div class="absolute inset-0 starfield pointer-events-none -z-10 mix-blend-overlay"></div>
<!-- Abstract gradient orbs for atmosphere -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[100px] -z-10"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[120px] -z-10"></div>

<header class="fixed top-0 left-0 w-full z-50 px-8 py-6 flex items-center justify-between border-b border-white/5 bg-gradient-to-b from-black/20 to-transparent backdrop-blur-sm">
<div class="flex items-center gap-4">
<div class="size-10 rounded-full border border-primary/30 flex items-center justify-center bg-primary/10 neon-box-cyan">
<span class="material-symbols-outlined text-primary text-2xl">all_inclusive</span>
</div>
<div>
<h2 class="text-white text-xl font-bold tracking-widest uppercase neon-text-cyan">Digital Alchemy</h2>
<span class="text-xs text-primary/60 tracking-[0.2em] uppercase">V 4.0.1 // Oracle Online</span>
</div>
</div>
<div class="hidden md:flex gap-4">
<div class="flex items-center gap-2 px-4 py-2 rounded-full border border-primary/20 bg-background-dark/50 glass-panel">

<span class="text-xs font-bold text-primary tracking-wider uppercase">System Potency: 98%</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 rounded-full border border-accent/20 bg-background-dark/50 glass-panel">

<span class="text-xs font-bold text-accent tracking-wider uppercase">Aether Flow: Stable</span>
</div>
</div>
</header>
<!-- Main Content Area: The Oracle Eye -->
<main class="relative z-10 w-full max-w-7xl mx-auto flex flex-col items-center justify-center h-screen pt-20 pb-10 px-4">

<div class="text-center mb-12 relative z-20">
<h1 class="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white via-primary to-white tracking-widest drop-shadow-[0_0_15px_rgba(0,238,255,0.5)]">
                    ASK THE ORACLE
                </h1>
<p class="text-primary/60 text-sm mt-2 tracking-[0.5em] uppercase font-light">Transmute Raw Data into Gold</p>
</div>
<!-- The Oracle Eye (Central Interactive Area) -->
<div class="relative flex items-center justify-center w-full max-w-3xl aspect-square md:aspect-video group/eye perspective-1000">
<!-- 3D Ring Simulation (Outer Torus) -->
<div class="absolute w-[300px] h-[300px] md:w-[500px] md:h-[500px] rounded-full border border-white/10 shadow-[0_0_50px_rgba(0,238,255,0.1)] opacity-40"></div>
<div class="absolute w-[280px] h-[280px] md:w-[480px] md:h-[480px] rounded-full border border-dashed border-primary/20 animate-[spin_60s_linear_infinite]"></div>
<div class="absolute w-[320px] h-[320px] md:w-[540px] md:h-[540px] rounded-full border border-dotted border-white/5 opacity-30 animate-[spin_40s_linear_infinite_reverse]"></div>
<!-- Glowing Energy Field -->
<div class="absolute w-[200px] h-[200px] md:w-[350px] md:h-[350px] bg-primary/5 rounded-full blur-3xl"></div>
<!-- Input Field (The Pupil) -->
<div class="relative z-30 w-full max-w-lg">
<div class="glass-panel rounded-full p-2 border border-primary/30 neon-box-cyan transition-all duration-500 hover:border-primary/60 hover:shadow-[0_0_40px_rgba(0,238,255,0.4)]">
<label class="flex items-center w-full h-14 md:h-16 px-2">
<input class="w-full bg-transparent border-none text-white placeholder-primary/40 focus:ring-0 text-lg md:text-xl font-light tracking-wide text-center" placeholder="Enter transmutation query..." type="text"/>
<button class="hidden md:flex size-12 rounded-full bg-primary text-background-dark items-center justify-center hover:bg-white transition-colors duration-300 shadow-[0_0_15px_rgba(0,238,255,0.6)]">
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</label>
</div>
</div>
<!-- Orbital Category Moons (Radio List Replacement) -->
<!-- Positioned absolutely relative to the center -->
<div class="absolute w-full h-full pointer-events-none z-20">
<!-- North Moon -->
<div class="absolute top-[10%] left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-auto transition-transform hover:scale-110">
<label class="cursor-pointer group flex flex-col items-center gap-2">
<input class="peer sr-only" name="category" type="radio"/>
<div class="size-14 rounded-full glass-panel border border-white/10 flex items-center justify-center text-white peer-checked:bg-primary peer-checked:text-background-dark peer-checked:border-primary peer-checked:shadow-[0_0_20px_#00eeff] transition-all duration-300 group-hover:border-primary/50">
<span class="material-symbols-outlined">dataset</span>
</div>
<span class="text-[10px] uppercase tracking-wider text-white/50 group-hover:text-primary transition-colors">Raw Data</span>
</label>
</div>
<!-- East Moon -->
<div class="absolute top-1/2 right-[10%] md:right-[15%] translate-x-1/2 -translate-y-1/2 pointer-events-auto transition-transform hover:scale-110">

<input class="peer sr-only" name="category" type="radio"/>
<div class="size-14 rounded-full glass-panel border border-white/10 flex items-center justify-center text-white peer-checked:bg-secondary peer-checked:text-white peer-checked:border-secondary peer-checked:shadow-[0_0_20px_#ff0099] transition-all duration-300 group-hover:border-secondary/50">
<span class="material-symbols-outlined">model_training</span>
</div>
<span class="text-[10px] uppercase tracking-wider text-white/50 group-hover:text-secondary transition-colors">Models</span>
</label>
</div>
<!-- South Moon -->
<div class="absolute bottom-[10%] left-1/2 -translate-x-1/2 translate-y-1/2 pointer-events-auto transition-transform hover:scale-110">
<label class="cursor-pointer group flex flex-col items-center gap-2">
<input class="peer sr-only" name="category" type="radio"/>
<div class="size-14 rounded-full glass-panel border border-white/10 flex items-center justify-center text-white peer-checked:bg-accent peer-checked:text-background-dark peer-checked:border-accent peer-checked:shadow-[0_0_20px_#ffd700] transition-all duration-300 group-hover:border-accent/50">
<span class="material-symbols-outlined">history</span>
</div>
<span class="text-[10px] uppercase tracking-wider text-white/50 group-hover:text-accent transition-colors">History</span>
</label>
</div>
<!-- West Moon -->
<div class="absolute top-1/2 left-[10%] md:left-[15%] -translate-x-1/2 -translate-y-1/2 pointer-events-auto transition-transform hover:scale-110">
<label class="cursor-pointer group flex flex-col items-center gap-2">
<input class="peer sr-only" name="category" type="radio"/>
<div class="size-14 rounded-full glass-panel border border-white/10 flex items-center justify-center text-white peer-checked:bg-white peer-checked:text-background-dark peer-checked:border-white peer-checked:shadow-[0_0_20px_white] transition-all duration-300 group-hover:border-white/50">
<span class="material-symbols-outlined">tune</span>
</div>
<span class="text-[10px] uppercase tracking-wider text-white/50 group-hover:text-white transition-colors">Config</span>
</label>
</div>
</div>
</div>
</main>
<!-- Liquid Dock (Floating Navigation) -->
<div class="fixed bottom-8 left-8 z-50 group">
<div class="relative flex flex-col-reverse items-start gap-4">
<!-- Main Orb (Trigger) -->
<button class="relative size-16 rounded-full glass-panel bg-gradient-to-br from-white/10 to-transparent border border-primary/30 flex items-center justify-center text-primary shadow-[0_8px_32px_rgba(0,0,0,0.5)] hover:shadow-[0_0_30px_rgba(0,238,255,0.4)] hover:bg-primary hover:text-background-dark transition-all duration-500 ease-out z-20">
<span class="material-symbols-outlined text-3xl group-hover:rotate-90 transition-transform duration-500">grid_view</span>

<div class="absolute bottom-full mb-4 left-1 flex flex-col gap-3 transition-all duration-500 origin-bottom transform translate-y-10 opacity-0 scale-75 group-hover:translate-y-0 group-hover:opacity-100 group-hover:scale-100 pointer-events-none group-hover:pointer-events-auto">

<span class="text-xs uppercase tracking-widest bg-black/80 px-2 py-1 rounded backdrop-blur-sm opacity-0 -translate-x-2 group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all">Dashboard</span>

</button>
<button class="flex items-center gap-3 group/item">
<div class="size-12 rounded-full glass-panel border border-white/10 bg-black/40 flex items-center justify-center text-white hover:bg-red-500 hover:border-red-500 hover:text-white transition-colors">

<span class="text-xs uppercase tracking-widest bg-black/80 px-2 py-1 rounded backdrop-blur-sm opacity-0 -translate-x-2 group-hover/item:opacity-100 group-hover/item:translate-x-0 transition-all">Logout</span>

</div>

<div class="text-[10px] uppercase tracking-[0.3em] text-white/40">Secure Connection</div>
<div class="text-[10px] uppercase tracking-[0.3em] text-primary/60 mt-1">Node: Alpha-Zero</div>
</div>
</div>
